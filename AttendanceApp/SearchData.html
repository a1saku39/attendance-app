<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打刻データ検索 - 勤怠管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            padding: 2rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: white;
        }

        .search-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-group input,
        .input-group select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background-color: white;
            color: var(--text-main);
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #f9fafb;
        }

        .results-section {
            padding: 2rem;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .results-count {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        td {
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-in {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-out {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-holiday {
            background: #e0f2fe;
            color: #0369a1;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: #f9fafb;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .search-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔍 打刻データ検索</h1>
            <a href="index.html" class="back-link">← メニューへ戻る</a>
        </div>

        <div class="search-section">
            <form id="searchForm" onsubmit="event.preventDefault(); performSearch();">
                <div class="search-grid">
                    <div class="input-group">
                        <label for="searchCode">社員コード</label>
                        <input type="text" id="searchCode" placeholder="例: 1001">
                    </div>
                    <div class="input-group">
                        <label for="searchName">氏名</label>
                        <input type="text" id="searchName" placeholder="例: 山田太郎">
                    </div>
                    <div class="input-group">
                        <label for="searchDept">部署</label>
                        <select id="searchDept">
                            <option value="">すべての部署</option>
                        </select>
                    </div>
                    <div class="input-group" style="grid-column: 1 / -1;">
                        <label>日にち (範囲)</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                            <input type="date" id="searchStartDate" style="flex: 1; min-width: 140px;">
                            <span style="color: var(--text-muted);">〜</span>
                            <input type="date" id="searchEndDate" style="flex: 1; min-width: 140px;">
                        </div>
                    </div>
                </div>
                <div class="search-actions">
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">クリア</button>
                    <button type="submit" class="btn btn-primary">検索する</button>
                </div>
            </form>
        </div>

        <div class="results-section">
            <div class="results-header">
                <h2 style="font-size: 1.25rem;">検索結果</h2>
                <div id="resultsCount" class="results-count">0 件見つかりました</div>
            </div>
            
            <div class="table-responsive">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>日にち</th>
                            <th>曜日</th>
                            <th>社員コード</th>
                            <th>氏名</th>
                            <th>部署</th>
                            <th>出勤</th>
                            <th>退勤</th>
                            <th>勤務時間</th>
                            <th>備考</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <tr>
                            <td colspan="9">
                                <div class="no-data">検索条件を入力して「検索する」ボタンを押してください</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetchDepartments();
        });

        function fetchDepartments() {
            const gasUrl = localStorage.getItem('attendance_gas_url');
            if (!gasUrl) return;

            fetch(gasUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'getDepartments' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success' && data.departments) {
                    const select = document.getElementById('searchDept');
                    data.departments.forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept;
                        option.textContent = dept;
                        select.appendChild(option);
                    });
                }
            })
            .catch(error => console.error('Error fetching departments:', error));
        }

        function clearForm() {
            document.getElementById('searchCode').value = '';
            document.getElementById('searchName').value = '';
            document.getElementById('searchDept').value = '';
            document.getElementById('searchStartDate').value = '';
            document.getElementById('searchEndDate').value = '';
            document.getElementById('resultsBody').innerHTML = `
                <tr>
                    <td colspan="9">
                        <div class="no-data">検索条件を入力して「検索する」ボタンを押してください</div>
                    </td>
                </tr>
            `;
            document.getElementById('resultsCount').textContent = '0 件見つかりました';
        }

        function performSearch() {
            const gasUrl = localStorage.getItem('attendance_gas_url');
            if (!gasUrl) {
                alert('GAS URLが設定されていません。トップページから設定してください。');
                return;
            }

            const searchCode = document.getElementById('searchCode').value.trim();
            const searchName = document.getElementById('searchName').value.trim();
            const searchDept = document.getElementById('searchDept').value.trim();
            const searchStartDate = document.getElementById('searchStartDate').value;
            const searchEndDate = document.getElementById('searchEndDate').value;

            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = `<tr><td colspan="9"><div class="loading">検索中...</div></td></tr>`;
            document.getElementById('resultsCount').textContent = '検索中...';

            fetch(gasUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'searchAttendanceData',
                    employeeCode: searchCode,
                    employeeName: searchName,
                    department: searchDept,
                    startDate: searchStartDate,
                    endDate: searchEndDate
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    renderResults(data.data);
                } else {
                    alert('エラーが発生しました: ' + data.message);
                    tbody.innerHTML = `<tr><td colspan="9"><div class="no-data" style="color:var(--danger)">エラー: ${data.message}</div></td></tr>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="9"><div class="no-data" style="color:var(--danger)">通信エラーが発生しました</div></td></tr>`;
            });
        }

        function renderResults(data) {
            const tbody = document.getElementById('resultsBody');
            document.getElementById('resultsCount').textContent = `${data.length} 件見つかりました`;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="no-data">条件に一致するデータが見つかりませんでした</div></td></tr>`;
                return;
            }

            let html = '';
            data.forEach(row => {
                let inBadge = '';
                if (row.inType === '出勤') {
                    inBadge = `<span class="badge badge-in">出勤</span>`;
                } else if (row.inType === '有給休暇' || row.inType === '代休') {
                    inBadge = `<span class="badge badge-holiday">${row.inType}</span>`;
                }

                let outBadge = '';
                if (row.outType === '退勤') {
                    outBadge = `<span class="badge badge-out">退勤</span>`;
                }

                html += `
                    <tr>
                        <td>${row.date}</td>
                        <td>${row.dayOfWeek}</td>
                        <td style="font-family: monospace;">${row.employeeCode}</td>
                        <td style="font-weight: 500;">${row.employeeName}</td>
                        <td>${row.department}</td>
                        <td>
                            <div style="display:flex; align-items:center; gap:5px;">
                                ${inBadge}
                                <span>${row.inTime}</span>
                            </div>
                        </td>
                        <td>
                            <div style="display:flex; align-items:center; gap:5px;">
                                ${outBadge}
                                <span>${row.outTime}</span>
                            </div>
                        </td>
                        <td style="font-weight: 500;">${row.workTime}</td>
                        <td style="color: var(--text-muted); font-size: 0.85rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis;" title="${row.remarks}">${row.remarks}</td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }
    </script>
</body>

</html>
